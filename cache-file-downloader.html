<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All-in-One Cache Downloader</title>
    <link rel="icon" type="image/png" href="https://img.icons8.com/office/40/download--v1.png">
    
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 500px;
        }
        h2 {
            margin-top: 0;
            color: #2c3e50;
            font-size: 24px;
            border-bottom: 2px solid #ecf0f1;
            padding-bottom: 10px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #4a5568;
        }
        .input-group {
            display: flex;
            gap: 10px;
        }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #cbd5e0;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }
        input[type="text"]:focus {
            outline: none;
            border-color: #3182ce;
            box-shadow: 0 0 0 3px rgba(66, 153, 225, 0.5);
        }
        .row {
            display: flex;
            gap: 15px;
        }
        .flex-3 { flex: 3; }
        .flex-1 { flex: 1; }
        
        /* Buttons */
        button {
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }
        .btn-primary {
            width: 100%;
            background-color: #3182ce;
            color: white;
            padding: 12px;
            font-size: 16px;
        }
        .btn-primary:hover {
            background-color: #2b6cb0;
        }
        .btn-secondary {
            background-color: #edf2f7;
            color: #4a5568;
            padding: 0 15px;
            font-size: 14px;
            border: 1px solid #cbd5e0;
            white-space: nowrap;
        }
        .btn-secondary:hover {
            background-color: #e2e8f0;
        }
        button:disabled {
            background-color: #a0aec0;
            color: #fff;
            cursor: not-allowed;
        }
        
        /* Status & Progress */
        #status {
            margin-top: 15px;
            padding: 10px;
            border-radius: 6px;
            display: none;
            font-size: 14px;
            word-break: break-all;
        }
        .info { background-color: #ebf8ff; color: #2b6cb0; border: 1px solid #bee3f8; }
        .success { background-color: #f0fff4; color: #234e52; border: 1px solid #c6f6d5; }
        .error { background-color: #fff5f5; color: #9b2c2c; border: 1px solid #fed7d7; }
        
        .progress-bar-container {
            width: 100%;
            background-color: #e2e8f0;
            border-radius: 4px;
            margin-top: 8px;
            display: none;
        }
        .progress-bar {
            height: 8px;
            background-color: #48bb78;
            width: 0%;
            border-radius: 4px;
            transition: width 0.1s ease;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Cache File Downloader</h2>
    
    <div class="form-group">
        <label for="urlInput">Direct Download URL</label>
        <div class="input-group">
            <input type="text" id="urlInput" placeholder="https://example.com/file.mp4" autocomplete="off">
            <button class="btn-secondary" onclick="pasteFromClipboard()">Paste</button>
        </div>
    </div>
    
    <div class="row">
        <div class="form-group flex-3">
            <label for="nameInput">File Name</label>
            <input type="text" id="nameInput" value="downloaded_file">
        </div>
        <div class="form-group flex-1">
            <label for="extInput">Extension</label>
            <input type="text" id="extInput" value="mp4" placeholder="mp4">
        </div>
    </div>
    
    <button id="downloadBtn" class="btn-primary" onclick="startDownload()">Fetch & Save File</button>
    
    <div id="status" class="info"></div>
    <div class="progress-bar-container" id="progressContainer">
        <div class="progress-bar" id="progressBar"></div>
    </div>
</div>

<script>
    async function pasteFromClipboard() {
        try {
            const text = await navigator.clipboard.readText();
            document.getElementById('urlInput').value = text;
            showStatus('URL pasted successfully!', 'success');
            setTimeout(() => {
                const statusDiv = document.getElementById('status');
                if(statusDiv.className === 'success' && statusDiv.innerText.includes('pasted')) {
                    statusDiv.style.display = 'none';
                }
            }, 2000);
        } catch (err) {
            showStatus('Failed to read clipboard. Please grant clipboard permissions or paste manually.', 'error');
            console.error('Clipboard error: ', err);
        }
    }

    async function startDownload() {
        const url = document.getElementById('urlInput').value.trim();
        let fileName = document.getElementById('nameInput').value.trim();
        let ext = document.getElementById('extInput').value.trim().replace(/^\./, ''); 
        
        const statusDiv = document.getElementById('status');
        const downloadBtn = document.getElementById('downloadBtn');
        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');

        if (!url) {
            showStatus('Please enter a valid URL.', 'error');
            return;
        }

        showStatus('Connecting and fetching to browser cache...', 'info');
        downloadBtn.disabled = true;
        progressContainer.style.display = 'block';
        progressBar.style.width = '0%';

        try {
            const response = await fetch(url);
            if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
            
            const contentLength = response.headers.get('content-length');
            const totalBytes = contentLength ? parseInt(contentLength, 10) : 0;
            
            const reader = response.body.getReader();
            let chunks = [];
            let receivedBytes = 0;

            while(true) {
                const {done, value} = await reader.read();
                if (done) break;
                
                chunks.push(value);
                receivedBytes += value.length;
                
                if (totalBytes > 0) {
                    const percentComplete = Math.round((receivedBytes / totalBytes) * 100);
                    progressBar.style.width = percentComplete + '%';
                    showStatus(`Caching to browser memory: ${percentComplete}%`, 'info');
                } else {
                    showStatus(`Caching to browser memory: ${(receivedBytes / (1024 * 1024)).toFixed(2)} MB loaded...`, 'info');
                }
            }

            showStatus('File cached successfully! Preparing save dialog...', 'info');
            const blob = new Blob(chunks);
            const finalFileName = ext ? `${fileName}.${ext}` : fileName;

            if ('showSaveFilePicker' in window) {
                try {
                    const handle = await window.showSaveFilePicker({ suggestedName: finalFileName });
                    const writable = await handle.createWritable();
                    await writable.write(blob);
                    await writable.close();
                    showStatus(`Success! File saved as: ${handle.name}`, 'success');
                } catch (err) {
                    if (err.name !== 'AbortError') {
                        fallbackDownload(blob, finalFileName);
                    } else {
                        showStatus('Save operation cancelled by user.', 'error');
                    }
                }
            } else {
                fallbackDownload(blob, finalFileName);
            }

        } catch (error) {
            console.error(error);
            showStatus(`Error: ${error.message}. <br><small>Note: Make sure the URL supports CORS if downloading from a different domain.</small>`, 'error');
        } finally {
            downloadBtn.disabled = false;
            progressContainer.style.display = 'none';
        }
    }

    function fallbackDownload(blob, filename) {
        const blobUrl = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = blobUrl;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(blobUrl);
        showStatus(`File processed. Triggered browser save for: ${filename}`, 'success');
    }

    // Fixed the missing "u" in function below
    function showStatus(text, type) {
        const statusDiv = document.getElementById('status');
        statusDiv.style.display = 'block';
        statusDiv.className = type;
        statusDiv.innerHTML = text;
    }
</script>

</body>
</html>
