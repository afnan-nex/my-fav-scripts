<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Link Converter - GitHub Tool by AFNAN</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #f6f3fb;
            --bg-secondary: rgba(255, 255, 255, 0.65);
            --bg-tertiary: rgba(255, 255, 255, 0.6);
            --bg-input: rgba(255, 255, 255, 0.8);
            --bg-button: rgba(255, 255, 255, 0.8);
            --bg-button-hover: rgba(255, 255, 255, 0.95);
            --bg-example: rgba(233, 227, 245, 0.5);
            --bg-output: rgba(255, 255, 255, 0.7);
            --bg-code: rgba(255, 255, 255, 0.6);
            --bg-recent: rgba(255, 255, 255, 0.6);
            --bg-recent-hover: rgba(255, 255, 255, 0.8);
            --bg-radio: rgba(255, 255, 255, 0.6);
            --bg-radio-hover: rgba(255, 255, 255, 0.85);
            --bg-secondary-button: #e9e3f5;
            --bg-secondary-button-hover: #dfd7ef;
            --bg-overlay: linear-gradient(135deg, rgba(255,255,255,0.85) 0%, rgba(246,243,251,0.88) 100%);
            
            --text-primary: #2a2540;
            --text-secondary: #4a4463;
            --text-tertiary: rgba(58, 53, 80, 0.7);
            --text-muted: rgba(74, 68, 99, 0.5);
            --text-placeholder: rgba(74, 68, 99, 0.45);
            
            --border-primary: rgba(200, 195, 220, 0.5);
            --border-secondary: rgba(255, 255, 255, 0.5);
            --border-tertiary: rgba(180, 170, 215, 0.3);
            --border-focus: rgba(150, 140, 200, 0.7);
            --border-secondary-button: rgba(180, 170, 215, 0.5);
            
            --shadow-nav: 0 8px 32px rgba(90, 80, 130, 0.08);
            --shadow-panel: 0 12px 40px rgba(90, 80, 130, 0.1);
            --shadow-button: 0 6px 20px rgba(90, 80, 130, 0.12);
            --shadow-primary: 0 8px 24px rgba(90, 80, 130, 0.15);
            
            --accent: #8a7fc4;
            --accent-success: #8ec24a;
            --accent-danger: #c45d5d;
            --accent-gradient: radial-gradient(circle at 30% 30%, #d6f5a8, #a8d86b 70%, #8ec24a);
            --accent-shadow: 0 3px 8px rgba(142, 194, 74, 0.4);
            --accent-focus: rgba(170, 160, 215, 0.15);
            
            --scrollbar-thumb: rgba(170, 160, 215, 0.3);
            --scrollbar-thumb-hover: rgba(150, 140, 200, 0.5);
            
            --transition-theme: 300ms ease;
        }

        [data-theme="dark"] {
            --bg-primary: #0d1117;
            --bg-secondary: #1c2128;
            --bg-tertiary: #161b22;
            --bg-input: #161b22;
            --bg-button: #161b22;
            --bg-button-hover: #1c2128;
            --bg-example: #161b22;
            --bg-output: #1c2128;
            --bg-code: #161b22;
            --bg-recent: #1c2128;
            --bg-recent-hover: #242b35;
            --bg-radio: #161b22;
            --bg-radio-hover: #1c2128;
            --bg-secondary-button: #2d333b;
            --bg-secondary-button-hover: #373e47;
            --bg-overlay: linear-gradient(135deg, rgba(13,17,23,0.95) 0%, rgba(22,27,34,0.95) 100%);
            
            --text-primary: #f0f6fc;
            --text-secondary: #c9d1d9;
            --text-tertiary: #8b949e;
            --text-muted: #6e7681;
            --text-placeholder: #6e7681;
            
            --border-primary: #30363d;
            --border-secondary: #30363d;
            --border-tertiary: #21262d;
            --border-focus: #3fb950;
            --border-secondary-button: #30363d;
            
            --shadow-nav: 0 8px 32px rgba(0, 0, 0, 0.3);
            --shadow-panel: 0 12px 40px rgba(0, 0, 0, 0.4);
            --shadow-button: 0 6px 20px rgba(0, 0, 0, 0.3);
            --shadow-primary: 0 8px 24px rgba(63, 185, 80, 0.20);
            
            --accent: #3fb950;
            --accent-success: #3fb950;
            --accent-danger: #f85149;
            --accent-gradient: radial-gradient(circle at 30% 30%, #56d364, #3fb950 70%, #238636);
            --accent-shadow: 0 3px 10px rgba(63, 185, 80, 0.35);
            --accent-focus: rgba(63, 185, 80, 0.25);
            
            --scrollbar-thumb: #30363d;
            --scrollbar-thumb-hover: #484f58;
        }

        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --bg-primary: #0d1117;
                --bg-secondary: #1c2128;
                --bg-tertiary: #161b22;
                --bg-input: #161b22;
                --bg-button: #161b22;
                --bg-button-hover: #1c2128;
                --bg-example: #161b22;
                --bg-output: #1c2128;
                --bg-code: #161b22;
                --bg-recent: #1c2128;
                --bg-recent-hover: #242b35;
                --bg-radio: #161b22;
                --bg-radio-hover: #1c2128;
                --bg-secondary-button: #2d333b;
                --bg-secondary-button-hover: #373e47;
                --bg-overlay: linear-gradient(135deg, rgba(13,17,23,0.95) 0%, rgba(22,27,34,0.95) 100%);
                
                --text-primary: #f0f6fc;
                --text-secondary: #c9d1d9;
                --text-tertiary: #8b949e;
                --text-muted: #6e7681;
                --text-placeholder: #6e7681;
                
                --border-primary: #30363d;
                --border-secondary: #30363d;
                --border-tertiary: #21262d;
                --border-focus: #3fb950;
                --border-secondary-button: #30363d;
                
                --shadow-nav: 0 8px 32px rgba(0, 0, 0, 0.3);
                --shadow-panel: 0 12px 40px rgba(0, 0, 0, 0.4);
                --shadow-button: 0 6px 20px rgba(0, 0, 0, 0.3);
                --shadow-primary: 0 8px 24px rgba(63, 185, 80, 0.20);
                
                --accent: #3fb950;
                --accent-success: #3fb950;
                --accent-danger: #f85149;
                --accent-gradient: radial-gradient(circle at 30% 30%, #56d364, #3fb950 70%, #238636);
                --accent-shadow: 0 3px 10px rgba(63, 185, 80, 0.35);
                --accent-focus: rgba(63, 185, 80, 0.25);
                
                --scrollbar-thumb: #30363d;
                --scrollbar-thumb-hover: #484f58;
            }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100%;
            overflow: hidden;
            font-family: 'Poppins', sans-serif;
            color: var(--text-primary);
            background: var(--bg-primary);
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            -webkit-font-smoothing: antialiased;
            transition: background-color var(--transition-theme), color var(--transition-theme);
        }

        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: var(--bg-overlay);
            z-index: 0;
            transition: background var(--transition-theme);
        }

        .app {
            position: relative;
            z-index: 1;
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            padding: 20px 40px;
            max-width: 1600px;
            margin: 0 auto;
        }

        nav {
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            padding: 12px 24px;
            background: var(--bg-tertiary);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-secondary);
            border-radius: 999px;
            margin-bottom: 16px;
            box-shadow: var(--shadow-nav);
            transition: all var(--transition-theme);
        }

        .nav-left {
            justify-self: start;
        }

        .nav-center {
            justify-self: center;
            text-align: center;
        }

        .nav-center h1 {
            font-size: 20px;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.02em;
            margin: 0;
            line-height: 1.2;
            transition: color var(--transition-theme);
        }

        .nav-center .subtitle {
            font-size: 11px;
            color: var(--text-tertiary);
            font-weight: 400;
            margin: 2px 0 0 0;
            transition: color var(--transition-theme);
        }

        .nav-right {
            justify-self: end;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo {
            font-weight: 600;
            font-size: 14px;
            color: var(--text-primary);
            text-decoration: none;
            transition: color var(--transition-theme);
        }

        nav a {
            font-size: 13px;
            color: var(--text-secondary);
            text-decoration: none;
            transition: color var(--transition-theme);
        }

        nav a:hover {
            color: var(--text-primary);
        }

        .theme-toggle {
            position: relative;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--bg-button);
            border: 1px solid var(--border-primary);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all var(--transition-theme);
            overflow: hidden;
        }

        .theme-toggle:hover {
            background: var(--bg-button-hover);
            transform: scale(1.05);
        }

        .theme-toggle svg {
            width: 18px;
            height: 18px;
            color: var(--text-secondary);
            transition: all var(--transition-theme);
            position: absolute;
        }

        .theme-toggle .sun-icon {
            opacity: 0;
            transform: rotate(-90deg) scale(0.5);
        }

        .theme-toggle .moon-icon {
            opacity: 1;
            transform: rotate(0deg) scale(1);
        }

        [data-theme="dark"] .theme-toggle .sun-icon {
            opacity: 1;
            transform: rotate(0deg) scale(1);
        }

        [data-theme="dark"] .theme-toggle .moon-icon {
            opacity: 0;
            transform: rotate(90deg) scale(0.5);
        }

        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) .theme-toggle .sun-icon {
                opacity: 1;
                transform: rotate(0deg) scale(1);
            }
            :root:not([data-theme="light"]) .theme-toggle .moon-icon {
                opacity: 0;
                transform: rotate(90deg) scale(0.5);
            }
        }

        .main-grid {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            min-height: 0;
        }

        .left-panel, .right-panel {
            background: var(--bg-secondary);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-secondary);
            border-radius: 24px;
            padding: 24px;
            box-shadow: var(--shadow-panel);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: all var(--transition-theme);
        }

        .example-box {
            background: var(--bg-example);
            border: 1px solid var(--border-primary);
            border-radius: 14px;
            padding: 12px 16px;
            margin-bottom: 16px;
            text-align: center;
            transition: all var(--transition-theme);
        }

        .example-box p {
            font-size: 11px;
            color: var(--text-secondary);
            margin-bottom: 6px;
            font-weight: 500;
            transition: color var(--transition-theme);
        }

        .example-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
        }

        .example-row code {
            font-size: 11px;
            background: var(--bg-code);
            padding: 5px 10px;
            border-radius: 8px;
            color: var(--text-primary);
            transition: all var(--transition-theme);
        }

        .arrow {
            font-size: 16px;
            color: var(--accent);
            font-weight: 600;
            transition: color var(--transition-theme);
        }

        form {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 14px;
            overflow-y: auto;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        label {
            font-size: 12px;
            font-weight: 500;
            color: var(--text-secondary);
            letter-spacing: 0.02em;
            transition: color var(--transition-theme);
        }

        input[type="url"],
        input[type="text"] {
            width: 100%;
            padding: 10px 14px;
            font-family: 'Poppins', sans-serif;
            font-size: 13px;
            color: var(--text-primary);
            background: var(--bg-input);
            border: 1px solid var(--border-primary);
            border-radius: 12px;
            outline: none;
            transition: all var(--transition-theme);
        }

        input::placeholder {
            color: var(--text-placeholder);
        }

        input:focus {
            border-color: var(--border-focus);
            background: var(--bg-button-hover);
            box-shadow: 0 0 0 3px var(--accent-focus);
        }

        fieldset {
            border: none;
            padding: 0;
        }

        legend {
            font-size: 12px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 8px;
            transition: color var(--transition-theme);
        }

        .radio-group {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }

        .radio-group label {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 12px;
            font-size: 12px;
            font-weight: 500;
            color: var(--text-secondary);
            background: var(--bg-radio);
            border: 1px solid var(--border-primary);
            border-radius: 10px;
            cursor: pointer;
            transition: all var(--transition-theme);
        }

        .radio-group label:hover {
            background: var(--bg-radio-hover);
        }

        input[type="radio"] {
            accent-color: var(--accent);
            width: 14px;
            height: 14px;
        }

        button {
            font-family: 'Poppins', sans-serif;
            font-weight: 500;
            font-size: 13px;
            padding: 11px 20px;
            border-radius: 999px;
            border: 1px solid var(--border-primary);
            background: var(--bg-button);
            color: var(--text-primary);
            cursor: pointer;
            transition: all var(--transition-theme);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        button:hover {
            background: var(--bg-button-hover);
            transform: translateY(-1px);
            box-shadow: var(--shadow-button);
        }

        button:focus {
            outline: 2px solid var(--border-focus);
            outline-offset: 2px;
        }

        button.primary {
            background: var(--bg-button-hover);
            color: var(--text-primary);
            border: 1px solid var(--border-primary);
            box-shadow: var(--shadow-primary);
            position: relative;
            padding-left: 44px;
        }

        button.primary::before {
            content: "";
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: var(--accent-gradient);
            box-shadow: var(--accent-shadow);
            transition: all var(--transition-theme);
        }

        button.secondary {
            background: var(--bg-secondary-button);
            color: var(--accent);
            border: 1px solid var(--border-secondary-button);
        }

        button.secondary:hover {
            background: var(--bg-secondary-button-hover);
        }

        .section-title {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border-tertiary);
            transition: all var(--transition-theme);
        }

        .output-section {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
        }

        .output {
            background: var(--bg-output);
            border: 1px solid var(--border-secondary);
            border-radius: 16px;
            padding: 14px;
            transition: all var(--transition-theme);
        }

        .output label {
            margin-bottom: 8px;
            display: block;
        }

        .output-item {
            display: flex;
            gap: 8px;
            align-items: stretch;
        }

        .output-item code {
            flex: 1;
            font-family: 'JetBrains Mono', 'Fira Code', ui-monospace, monospace;
            font-size: 12px;
            color: var(--text-primary);
            background: var(--bg-code);
            border: 1px solid var(--border-primary);
            border-radius: 10px;
            padding: 10px 12px;
            display: flex;
            align-items: center;
            word-break: break-all;
            transition: all var(--transition-theme);
        }

        .output-item button {
            flex-shrink: 0;
            padding: 10px 16px;
            font-size: 12px;
        }

        .recent-section {
            margin-top: auto;
            display: flex;
            flex-direction: column;
        }

        .recent {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 180px;
            overflow-y: auto;
        }

        .recent li {
            padding: 10px 14px;
            background: var(--bg-recent);
            border: 1px solid var(--border-primary);
            border-radius: 12px;
            font-size: 12px;
            color: var(--text-secondary);
            transition: all var(--transition-theme);
        }

        .recent li:hover {
            background: var(--bg-recent-hover);
        }

        .hidden {
            display: none !important;
        }

        footer {
            text-align: center;
            color: var(--text-muted);
            font-size: 11px;
            padding: 12px 0 0;
            transition: color var(--transition-theme);
        }

        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--scrollbar-thumb);
            border-radius: 999px;
            transition: background var(--transition-theme);
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--scrollbar-thumb-hover);
        }

        @media (max-width: 1024px) {
            .app {
                padding: 16px 24px;
            }

            .main-grid {
                grid-template-columns: 1fr;
                gap: 16px;
            }

            .left-panel, .right-panel {
                padding: 20px;
            }
        }

        @media (max-width: 768px) {
            nav {
                grid-template-columns: 1fr;
                grid-template-rows: auto auto auto;
                gap: 10px;
                border-radius: 24px;
                padding: 16px;
                text-align: center;
            }
            
            .nav-left, .nav-center, .nav-right {
                justify-self: center;
            }
            
            .nav-center h1 {
                font-size: 18px;
            }
        }

        @media (max-height: 800px) {
            nav {
                padding: 10px 20px;
            }

            .nav-center h1 {
                font-size: 18px;
            }

            .nav-center .subtitle {
                font-size: 10px;
            }

            .example-box {
                padding: 10px 14px;
                margin-bottom: 12px;
            }

            form {
                gap: 12px;
            }

            .field {
                gap: 4px;
            }

            input[type="url"],
            input[type="text"] {
                padding: 9px 12px;
                font-size: 12px;
            }

            .radio-group {
                gap: 6px;
            }

            .radio-group label {
                padding: 7px 10px;
                font-size: 11px;
            }

            button {
                padding: 10px 18px;
                font-size: 12px;
            }

            .output {
                padding: 12px;
            }

            .output-item code {
                font-size: 11px;
                padding: 8px 10px;
            }

            .recent {
                max-height: 140px;
            }

            .recent li {
                padding: 8px 12px;
                font-size: 11px;
            }
        }
    </style>
</head>
<body>
    <div class="app">
        <nav>
            <div class="nav-left">
                <a href="#" class="logo">GitHub Link Converter</a>
            </div>
            <div class="nav-center">
                <h1>Link.Convert</h1>
                <p class="subtitle">Transform blob URLs into GitHub Pages links instantly.</p>
            </div>
            <div class="nav-right">
                <a href="#">GitHub Tool by AFNAN</a>
                <button class="theme-toggle" id="themeToggle" aria-label="Toggle theme">
                    <svg class="sun-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>
                    </svg>
                    <svg class="moon-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
                    </svg>
                </button>
            </div>
        </nav>

        <div class="main-grid">
            <div class="left-panel">
                <div class="example-box">
                    <p>Example</p>
                    <div class="example-row">
                        <code>.../blob/main/file.html</code>
                        <span class="arrow">→</span>
                        <code>...github.io/file.html</code>
                    </div>
                </div>

                <form id="converterForm">
                    <div class="field">
                        <label for="blobUrl">GitHub Blob URL <span style="color: var(--accent-danger);">Required</span></label>
                        <input type="url" id="blobUrl" placeholder="https://github.com/username/repo/blob/main/file.html" required>
                    </div>

                    <div class="field">
                        <label for="linkText">Link Text</label>
                        <input type="text" id="linkText" placeholder="Optional: Display text for anchor">
                    </div>

                    <fieldset>
                        <legend>Open In</legend>
                        <div class="radio-group">
                            <label>
                                <input type="radio" name="target" value="_blank" checked>
                                New Tab
                            </label>
                            <label>
                                <input type="radio" name="target" value="_self">
                                Same Tab
                            </label>
                            <label>
                                <input type="radio" name="target" value="_parent">
                                Parent Frame
                            </label>
                            <label>
                                <input type="radio" name="target" value="_top">
                                Top Frame
                            </label>
                        </div>
                    </fieldset>

                    <button type="submit" id="convertBtn" class="primary">Convert Link</button>
                </form>
            </div>

            <div class="right-panel">
                <div class="output-section">
                    <div id="outputSection" class="hidden">
                        <h3 class="section-title">Output</h3>
                        
                        <div class="output">
                            <label>Pages URL</label>
                            <div class="output-item">
                                <code id="pagesUrl"></code>
                                <button type="button" class="secondary copy-btn" onclick="copyToClipboard('pagesUrl')">Copy</button>
                            </div>
                        </div>

                        <div class="output">
                            <label>HTML Anchor</label>
                            <div class="output-item">
                                <code id="htmlAnchor"></code>
                                <button type="button" class="secondary copy-btn" onclick="copyToClipboard('htmlAnchor')">Copy</button>
                            </div>
                        </div>
                    </div>

                    <div class="recent-section">
                        <h3 class="section-title">Recent Conversions</h3>
                        <ul id="recentList" class="recent">
                            <li style="color: var(--text-muted); font-style: italic;">No conversions yet</li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>

        <footer>
            <p>GitHub Link Converter - A tool by AFNAN</p>
        </footer>
    </div>

    <script>
        // Theme Management
        const themeToggle = document.getElementById('themeToggle');
        const html = document.documentElement;
        
        function getSystemTheme() {
            return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        
        function setTheme(theme) {
            html.setAttribute('data-theme', theme);
            localStorage.setItem('theme', theme);
        }
        
        function initTheme() {
            const savedTheme = localStorage.getItem('theme');
            if (savedTheme) {
                setTheme(savedTheme);
            } else {
                setTheme(getSystemTheme());
            }
        }
        
        themeToggle.addEventListener('click', () => {
            const currentTheme = html.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            setTheme(newTheme);
        });
        
        window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
            if (!localStorage.getItem('theme')) {
                setTheme(e.matches ? 'dark' : 'light');
            }
        });
        
        initTheme();

        // Converter Logic
        let recentConversions = [];

        document.getElementById('converterForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const blobUrl = document.getElementById('blobUrl').value.trim();
            const linkText = document.getElementById('linkText').value.trim();
            const target = document.querySelector('input[name="target"]:checked').value;
            
            if (!blobUrl) {
                alert('Please enter a GitHub blob URL');
                return;
            }
            
            const pagesUrl = convertBlobToPages(blobUrl);
            const htmlAnchor = generateHtmlAnchor(pagesUrl, linkText, target);
            
            document.getElementById('pagesUrl').textContent = pagesUrl;
            document.getElementById('htmlAnchor').textContent = htmlAnchor;
            document.getElementById('outputSection').classList.remove('hidden');
            
            addToRecent(blobUrl, pagesUrl, linkText);
        });

        function convertBlobToPages(blobUrl) {
            const pattern = /github\.com\/([^\/]+)\/([^\/]+)\/blob\/([^\/]+)\/(.+)/;
            const match = blobUrl.match(pattern);
            
            if (match) {
                const [, username, repo, branch, filePath] = match;
                return `https://${username}.github.io/${repo}/${filePath}`;
            }
            
            return 'Invalid GitHub blob URL';
        }

        function generateHtmlAnchor(url, text, target) {
            const displayText = text || url.split('/').pop();
            return `<a href="${url}" target="${target}">${displayText}</a>`;
        }

        function copyToClipboard(elementId) {
            const element = document.getElementById(elementId);
            const text = element.textContent;
            
            navigator.clipboard.writeText(text).then(() => {
                const btn = element.nextElementSibling;
                const originalText = btn.textContent;
                btn.textContent = 'Copied!';
                setTimeout(() => {
                    btn.textContent = originalText;
                }, 2000);
            }).catch(err => {
                console.error('Failed to copy:', err);
                alert('Failed to copy to clipboard');
            });
        }

        function addToRecent(originalUrl, pagesUrl, linkText) {
            recentConversions.unshift({
                original: originalUrl,
                pages: pagesUrl,
                text: linkText || 'No text',
                time: new Date().toLocaleTimeString()
            });
            
            if (recentConversions.length > 5) {
                recentConversions.pop();
            }
            
            updateRecentList();
        }

        function updateRecentList() {
            const list = document.getElementById('recentList');
            
            if (recentConversions.length === 0) {
                list.innerHTML = '<li style="color: var(--text-muted); font-style: italic;">No conversions yet</li>';
                return;
            }
            
            list.innerHTML = recentConversions.map(conv => `
                <li>
                    <div style="font-weight: 500; color: var(--text-primary); margin-bottom: 3px;">${conv.text}</div>
                    <div style="font-size: 11px; color: var(--text-tertiary);">${conv.pages}</div>
                    <div style="font-size: 10px; color: var(--text-muted); margin-top: 3px;">${conv.time}</div>
                </li>
            `).join('');
        }
    </script>
</body>
</html>
